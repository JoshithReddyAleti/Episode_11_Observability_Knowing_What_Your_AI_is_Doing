groups:
  - name: ai_alerts
    rules:
      - alert: HighErrorRate
        expr: rate(requests_total{status=~"5.."}[5m]) / rate(requests_total[5m]) > 0.05
        for: 5m
        labels: { severity: page }
        annotations: { summary: "Error rate above 5%" }
      - alert: CostSpike
        expr: rate(llm_cost_dollars_total[1h]) > 3 * rate(llm_cost_dollars_total[1h] offset 1d)
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Hourly cost 3x above yesterday" }
      - alert: QualityDrop
        expr: avg_over_time(quality_score[1h]) < 0.7
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Quality score below threshold" }
